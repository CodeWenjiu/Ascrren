[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
msu2-core = { path = "crates/msu2-core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "sync", "signal"] }
tokio-serial = { version = "5.5", features = ["libudev"] }

clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
slint = { version = "1.19", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
chrono = "0.4"
course-signin = { git = "https://github.com/CodeWenjiu/ucase_course_signin", package = "course-signin" }
