[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
crate-macro = { path = "crates/crate_macro" }
msu2-core = { path = "crates/msu2-core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "sync", "signal"] }
tokio-serial = { version = "5.5", features = ["libudev"] }

clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
